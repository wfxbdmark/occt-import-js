name: Build OCCT memory64 WASM

# 用法：
# 1. fork https://github.com/kovacsv/occt-import-js 到你的 GitHub 账号
# 2. 把本文件放到 fork 仓库的 .github/workflows/build-memory64.yml
# 3. 把 patch_memory64.py 放到 fork 仓库根目录
# 4. Actions 标签页手动触发 "Build OCCT memory64 WASM"
# 5. 跑完后在 run 页面底部 Artifacts 下载 occt-import-js-memory64.zip
#
# 关键修复（v2）：
#  - OCCT 官方 git 服务器证书坏了 -> 改用 GitHub 镜像 Open-Cascade-SAS/OCCT
#  - 每个关键步骤独立 + set -e，子模块/源码拉取失败会真正让 CI 失败（不再出空壳）
#  - 编译后强制校验 wasm 体积 > 3MB，否则判定 OCCT 未编入并 fail

on:
  workflow_dispatch:
  push:
    branches: [memory64]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout occt-import-js (不拉子模块)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone OCCT from GitHub mirror (完整克隆 + 精确 pin commit + 硬校验)
        run: |
          set -euo pipefail
          # 取 occt-import-js 固定的 OCCT 子模块 commit（这是布局匹配的关键）
          OCCT_SHA=$(git ls-tree HEAD occt | awk '{print $3}')
          echo "occt-import-js 固定的 OCCT commit = ${OCCT_SHA:-<none>}"
          if [ -z "${OCCT_SHA:-}" ]; then
            echo "::error::取不到 OCCT 子模块 commit"; exit 1
          fi
          rm -rf occt
          # 完整克隆（不要 --filter，否则 cat-file 检测不到 commit）
          git clone https://github.com/Open-Cascade-SAS/OCCT.git occt
          pushd occt
          echo "=== checkout 精确 commit（失败则硬退出，绝不回退到错误版本）==="
          git checkout --quiet "$OCCT_SHA"
          echo "OCCT 实际版本: $(git describe --tags --always)"
          popd

          echo "=== 诊断：OCCT 源码布局 ==="
          test -d occt/src
          echo "occt/src 一级目录数: $(ls occt/src | wc -l)"
          echo "occt/src 前 10 个目录:"; ls occt/src | head -10
          CXX_COUNT=$(find occt/src -name '*.cxx' | wc -l | tr -d ' ')
          echo ".cxx 源文件总数: $CXX_COUNT"
          echo "STEPControl 模块是否经典布局（.cxx 直接在模块目录下）:"
          ls occt/src/STEPControl/*.cxx 2>/dev/null | head -3 || echo "  !! 未找到 occt/src/STEPControl/*.cxx —— 布局可能已变"
          # 硬闸门：源文件数必须上万，否则布局不对，直接失败
          if [ "$CXX_COUNT" -lt 5000 ]; then
            echo "::error::OCCT .cxx 源文件仅 $CXX_COUNT 个（应上万），布局与 CMakeLists 的 glob 不匹配"
            exit 1
          fi

      - name: Setup Emscripten (latest，最终版 memory64 规范，匹配 Chrome 133+)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Patch CMakeLists for memory64
        run: python3 patch_memory64.py

      - name: Configure (emcmake)
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release .

      - name: Build (全套 OCCT，约 20-40 分钟)
        run: cmake --build build --config Release -j4

      - name: Sanity check (体积 > 3MB 才算真的把 OCCT 编进去了)
        run: |
          set -euo pipefail
          WASM=$(find build -name occt-import-js.wasm | head -1)
          JS=$(find build -name occt-import-js.js | head -1)
          echo "wasm = $WASM"
          echo "js   = $JS"
          test -f "$WASM"
          test -f "$JS"
          SZ=$(stat -c%s "$WASM")
          echo "wasm 体积 = $SZ bytes"
          if [ "$SZ" -lt 3000000 ]; then
            echo "::error::wasm 仅 $SZ 字节（<3MB），OCCT 未被编入，构建无效！"
            exit 1
          fi
          echo "产物校验通过（wasm 体积正常）"
          # 复制到固定输出目录，方便上传
          mkdir -p out
          cp "$WASM" out/occt-import-js.wasm
          cp "$JS" out/occt-import-js.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: occt-import-js-memory64
          path: out/*
          if-no-files-found: error
